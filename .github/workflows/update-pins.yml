name: Update pins

# Zieht den APP_IMAGE-Pin im Dockerfile auf das neueste App-Release nach.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Neuestes App-Release ermitteln
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api repos/mschabhuettl/openschichtplaner5/releases/latest -q .tag_name)
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Dockerfile-Pin setzen
        run: |
          sed -i "s|openschichtplaner5:[0-9.]*\"|openschichtplaner5:${{ steps.latest.outputs.version }}\"|" Dockerfile

      - name: Commit & Push
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Dockerfile
            git commit -m "build(docker): APP_IMAGE-Pin auf ${{ steps.latest.outputs.version }}"
            git push
          fi
