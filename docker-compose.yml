# Rein lesender Viewer: DBF-Quelle read-only gemountet (Normalbetrieb).
# SP5_READONLY ist im Image hart erzwungen; SP5_CORE_ONLY optional frei.
# Es gibt kein publiziertes Viewer-Image — das Image wird lokal aus dem
# Dockerfile gebaut: docker compose up -d --build.
services:
  sp5-viewer:
    build: .
    image: openschichtplaner5-viewer:local
    ports:
      - "${SP5_VIEWER_PORT:-8080}:8000"
    environment:
      SP5_DB_PATH: /app/data
      SP5_CORE_ONLY: ${SP5_CORE_ONLY:-false}
    volumes:
      - ${SP5_DB_PATH:?Pfad zu den DBF-Dateien}:/app/data:ro
